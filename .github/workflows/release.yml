name: Release

on:
  push:
    branches:
      - release

permissions:
  # contents: write 用于创建 GitHub Release；id-token: write 用于申请 OIDC 可信发布令牌
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # 仅当最新提交信息以 "bump version" 开头时触发
    if: startsWith(github.event.head_commit.message, 'bump version')
    # `vsce publish --oidc` 目前仅在 vsce 预发布版提供（稳定版 3.9.2 及其以下无此参数）
    # 待 3.9.3 稳定版发布后，可将 VSCE_VERSION 改为 latest 或移除该变量
    env:
      VSCE_VERSION: 3.9.3-12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # vsce 3.9+ 要求 Node.js >= 22
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get version from package.json
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npx --yes @vscode/vsce@$VSCE_VERSION package --allow-missing-repository

      # 从 CHANGELOG.md 提取当前版本（vX.Y.Z）对应的更新日志条目，作为 Release 说明
      - name: Extract changelog for this version
        run: |
          awk -v v="[${{ steps.version.outputs.value }}]" 'index($0, "## " v) == 1 { capture = 1; next } capture && /^## \[/ { exit } capture { print }' CHANGELOG.md > RELEASE_NOTES.md
          # 未找到对应版本条目时回退为默认标题，避免空文件导致 Release 失败
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "v${{ steps.version.outputs.value }}" > RELEASE_NOTES.md
          fi

      # 发布到 VS Code 插件市场：OIDC 可信发布（无需 PAT，不存在长期凭据泄露风险）
      # 前置条件：已在插件市场发布者管理页为该仓库 + 本工作流配置 trusted publishing policy
      - name: Publish to VS Code Marketplace
        run: |
          npx --yes @vscode/vsce@$VSCE_VERSION publish \
            --packagePath "deepseek-completion-${{ steps.version.outputs.value }}.vsix" \
            --allow-missing-repository \
            --skip-duplicate \
            --oidc

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" deepseek-completion-*.vsix \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file RELEASE_NOTES.md
